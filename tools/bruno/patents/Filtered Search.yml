info:
  name: Filtered search
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/api/patents/search?query=wheel%20spoke&classification_prefix=B60B&title_keywords=wheel&limit=2"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("Classification and literal title constraints apply", function () {
        expect(res.getStatus()).to.equal(200);
        const body = res.getBody();
        expect(body.total_matches).to.be.above(0);
        expect(body.total_matches).to.be.at.most(bru.getVar("searchTotal"));
        body.results.forEach(function (row) {
          expect(row.classification.startsWith("B60B")).to.equal(true);
          expect(row.title.toLowerCase()).to.match(/\bwheel\b/);
        });
        expect(body.effective_request.title_keywords).to.deep.equal(["wheel"]);
      });
