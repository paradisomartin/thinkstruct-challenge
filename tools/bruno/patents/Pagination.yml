info:
  name: Second search page
  type: http
  seq: 3
http:
  method: GET
  url: "{{baseUrl}}/api/v1/patents/search?query=wheel%20spoke&limit=2&offset=2"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("Stable pagination keeps total and avoids first-page duplicates", function () {
        expect(res.getStatus()).to.equal(200);
        const body = res.getBody();
        expect(body.total_matches).to.equal(bru.getVar("searchTotal"));
        expect(body.results).to.have.lengthOf(2);
        body.results.forEach(function (row) {
          expect(bru.getVar("firstPageIds")).not.to.include(row.doc_number);
        });
      });
