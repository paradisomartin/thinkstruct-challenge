info:
  name: Exact title lookup
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/api/v1/patents/search?title_exact=%20spoke%20&limit=2"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("Normalized title lookup has no relevance score", function () {
        expect(res.getStatus()).to.equal(200);
        const body = res.getBody();
        expect(body.total_matches).to.be.above(0);
        body.results.forEach(function (row) {
          expect(row.title.trim().toLowerCase()).to.equal("spoke");
          expect(row.score).to.equal(null);
          expect(row.excerpt.source_field).to.equal("title");
          expect(row.excerpt.source_index).to.equal(null);
        });
      });
