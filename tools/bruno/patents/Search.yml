info:
  name: Ranked search
  type: http
  seq: 1
http:
  method: GET
  url: "{{baseUrl}}/api/v1/patents/search?query=wheel%20spoke&limit=2"
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |
      test("Ranked search returns evidence and provenance", function () {
        expect(res.getStatus()).to.equal(200);
        const body = res.getBody();
        expect(body.total_matches).to.be.above(2);
        expect(body.results).to.have.lengthOf(2);
        body.results.forEach(function (row) {
          expect(row.score).to.be.a("number");
          expect(row.ranking_method).to.equal("ts_rank");
          expect(row.source_file).to.be.a("string");
          expect(row.record_index).to.be.at.least(0);
          expect(row.excerpt.text).to.be.a("string").and.not.empty;
          expect(row).not.to.have.property("raw_record");
        });
        expect(body.results[0].score).to.be.at.least(body.results[1].score);
        bru.setVar("searchTotal", body.total_matches);
        bru.setVar("firstPageIds", body.results.map(row => row.doc_number));
      });
