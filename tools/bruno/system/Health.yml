info:
  name: Health
  type: http
  seq: 1
  tags:
    - system

http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: inherit

scripts:
  - type: tests
    code: |
      test("API and database are ready", function () {
        expect(res.getStatus()).to.equal(200);
        expect(res.getBody()).to.deep.equal({status: "ok", database: "ok"});
      });

runtime:
  scripts:
    - type: tests
      code: |
        test("Health status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Application and database are ready", function () {
          expect(res.getBody()).to.deep.equal({status: "ok", database: "ok"});
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "database": "ok"
          }
  - name: 503 Response
    description: Service Unavailable
    request:
      url: "{{baseUrl}}/api/health"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "unavailable",
            "database": "unavailable"
          }

docs: "Readiness: the application can execute a query against PostgreSQL."
