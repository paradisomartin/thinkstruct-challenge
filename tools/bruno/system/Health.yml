info:
  name: Health
  type: http
  seq: 1
  tags:
    - system

http:
  method: GET
  url: "{{baseUrl}}/api/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "database": "ok"
          }
  - name: 503 Response
    description: Service Unavailable
    request:
      url: "{{baseUrl}}/api/health"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "ok",
            "database": "ok"
          }

docs: "Readiness: the application can execute a query against PostgreSQL."
